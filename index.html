<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسالة تقدير - Amgad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Lemonada:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* خلفية فاتحة بتدرج ناعم جداً كما بالصورة الأولى */
      background: radial-gradient(circle at 15% 15%, #fffdf9 0%, transparent 50%),
                  radial-gradient(circle at 85% 85%, #edf5ff 0%, transparent 60%),
                  linear-gradient(180deg, #f5f8fc 0%, #eef4fc 50%, #fff7f0 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      padding: 20px;
      position: relative;
    }

    /* خلفية النجوم المتناثرة البرتقالية والزرقاء */
    .stars-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(circle, #ff944d 2.5px, transparent 2.5px),
        radial-gradient(circle, #3182ce 2px, transparent 2px),
        radial-gradient(circle, #f6ad55 3px, transparent 3px),
        radial-gradient(circle, #2b6cb0 2px, transparent 2px);
      background-size: 190px 190px, 250px 250px, 210px 210px, 270px 270px;
      background-position: 25px 35px, 140px 90px, 75px 160px, 200px 230px;
      opacity: 0.65;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      z-index: 1;
    }

    /* المظروف المغلق */
    .envelope-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 310px;
      background-color: #ff9e3b;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(255, 140, 0, 0.22), 0 5px 15px rgba(0,0,0,0.05);
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .envelope-wrapper:hover {
      transform: translateY(-6px) scale(1.02);
    }

    .envelope-wrapper.hide {
      opacity: 0;
      transform: scale(0.85) translateY(-40px);
      pointer-events: none;
      position: absolute;
    }

    /* غطاء المظروف */
    .envelope-flap-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 240px solid transparent;
      border-right: 240px solid transparent;
      border-top: 160px solid #f28b24;
      transform-origin: top;
      z-index: 3;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.08));
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .envelope-pocket::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 240px solid #ff8f24;
      border-bottom: 155px solid #ff8f24;
      border-top: 155px solid transparent;
      border-right: 240px solid transparent;
    }

    .envelope-pocket::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-right: 240px solid #ff8f24;
      border-bottom: 155px solid #ff8f24;
      border-top: 155px solid transparent;
      border-left: 240px solid transparent;
    }

    /* الختم الدائري الأبيض لاسم Amgad */
    .wax-seal {
      position: absolute;
      z-index: 4;
      width: 95px;
      height: 95px;
      background: #ffffff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      border: 3.5px solid #1a569d;
      transition: transform 0.3s ease;
    }

    .envelope-wrapper:hover .wax-seal {
      transform: scale(1.08);
    }

    .seal-text {
      font-family: 'Lemonada', cursive;
      color: #1a569d;
      font-size: 1.15rem;
      font-weight: 700;
    }

    /* كارت الجواب المفتوح */
    .letter-card {
      width: 100%;
      max-width: 740px;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.1);
      padding: 12px;
      display: none;
      opacity: 0;
      transform: translateY(30px) scale(0.96);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .letter-card.show {
      display: block;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .card-content-layout {
      display: flex;
      border-radius: 18px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      min-height: 380px;
    }

    /* الجانب الأيمن: النص وخلفية الفن الزيتي الزرقاء والبيضاء والبرتقالية الفاتحة بالـ Pure CSS */
    .text-side {
      flex: 1;
      padding: 45px 35px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background-color: #f0f6ff;
      background-image: 
        radial-gradient(circle at 80% 20%, rgba(255, 183, 3, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(147, 197, 253, 0.4) 0%, transparent 50%),
        repeating-radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0, rgba(224, 242, 254, 0.6) 20px, rgba(255, 255, 255, 0.8) 40px);
    }

    /* لمسات فنية زرقاء وبرتقالية كدوامات زرقاء فاتحة فوق الخلفية */
    .text-side::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at top right, rgba(255, 140, 0, 0.12), transparent 50%),
        radial-gradient(ellipse at bottom left, rgba(59, 130, 246, 0.15), transparent 50%);
      pointer-events: none;
    }

    .message-body {
      position: relative;
      z-index: 2;
      font-size: 1.25rem;
      line-height: 2.2;
      color: #1e3a8a;
      font-weight: 700;
      text-align: justify;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    /* الجانب الأيسر: الشارة (Great Job!) مصممة بـ SVG نقي مدمج */
    .image-side {
      width: 250px;
      background: linear-gradient(135deg, #fffaf5 0%, #fff0e6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      flex-shrink: 0;
      border-left: 1px solid #ffe3d1;
    }

    .badge-wrapper {
      width: 100%;
      max-width: 190px;
      filter: drop-shadow(0 10px 18px rgba(243, 111, 33, 0.25));
      transition: transform 0.3s ease;
    }

    .badge-wrapper:hover {
      transform: scale(1.05) rotate(2deg);
    }

    /* تجاوب الشاشات الصغرى */
    @media (max-width: 768px) {
      .envelope-wrapper {
        height: 270px;
      }
      .card-content-layout {
        flex-direction: column-reverse;
      }
      .image-side {
        width: 100%;
        padding: 30px;
        border-left: none;
        border-top: 1px solid #ffe3d1;
      }
      .badge-wrapper {
        max-width: 150px;
      }
      .text-side {
        padding: 30px 20px;
      }
      .message-body {
        font-size: 1.08rem;
        line-height: 1.95;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="stars-bg"></div>

  <div class="container">
    <!-- المظروف البرتقالي المغلق -->
    <div class="envelope-wrapper" id="envelope" onclick="openEnvelope()">
      <div class="envelope-flap-top"></div>
      <div class="envelope-pocket"></div>
      <div class="wax-seal">
        <span class="seal-text">Amgad</span>
      </div>
    </div>

    <!-- كارت الجواب بعد الفتح -->
    <div class="letter-card" id="letter">
      <div class="card-content-layout">
        
        <!-- قسم النص المكتوب مع خلفية الفن المضاء الزيتية الزرقاء والبرتقالية بالـ Pure CSS -->
        <div class="text-side">
          <p class="message-body">
            باشمهندس امجد حقيقي من اكثر الناس المجتهده و ال بتحاول تطور من نفسها و تعرف ايه الجديد في مجالك ف حاول تحافظ على ده  و حقيقي انا شخصيا بحاول اتعلم منك ازاي اعمل ده و فعلا وجودك فارق في التيم  .. بالتوفيق ليك و بالتوفيق في الميدترم ✨
          </p>
        </div>

        <!-- قسم الشارة الجانبية (GREAT JOB!) مبنية بنسبة 100% بالـ SVG الداخلي -->
        <div class="image-side">
          <div class="badge-wrapper">
            <svg viewBox="0 0 200 240" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
              <!-- الشريط الأسفل (الشرائط الزرقاء/التركواز) -->
              <path d="M 65,145 L 45,225 L 75,205 L 95,225 L 85,145 Z" fill="#00c4cc" stroke="#00999e" stroke-width="2"/>
              <path d="M 135,145 L 115,225 L 135,205 L 155,225 L 145,145 Z" fill="#00c4cc" stroke="#00999e" stroke-width="2"/>
              
              <!-- إطار الوريدة البرتقالية الخارجية (Scalloped Edges) -->
              <circle cx="100" cy="100" r="72" fill="#ff7a00"/>
              <!-- دواير التعرج الحواف -->
              <g fill="#ff7a00">
                <circle cx="100" cy="24" r="14"/><circle cx="122" cy="28" r="14"/><circle cx="142" cy="39" r="14"/><circle cx="159" cy="56" r="14"/><circle cx="170" cy="77" r="14"/><circle cx="174" cy="100" r="14"/><circle cx="170" cy="123" r="14"/><circle cx="159" cy="144" r="14"/><circle cx="142" cy="161" r="14"/><circle cx="122" cy="172" r="14"/><circle cx="100" cy="176" r="14"/><circle cx="78" cy="172" r="14"/><circle cx="58" cy="161" r="14"/><circle cx="41" cy="144" r="14"/><circle cx="30" cy="123" r="14"/><circle cx="26" cy="100" r="14"/><circle cx="30" cy="77" r="14"/><circle cx="41" cy="56" r="14"/><circle cx="58" cy="39" r="14"/><circle cx="78" cy="28" r="14"/>
              </g>

              <!-- الحدود البيضاء الداخلية -->
              <circle cx="100" cy="100" r="66" fill="#ffffff"/>
              <!-- الدائرة الصفراء المركزية -->
              <circle cx="100" cy="100" r="58" fill="#ffc107"/>

              <!-- نص GREAT JOB! -->
              <text x="100" y="86" text-anchor="middle" fill="#111111" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="22" letter-spacing="1">GREAT</text>
              <text x="100" y="122" text-anchor="middle" fill="#111111" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="30" letter-spacing="1">JOB!</text>
              
              <!-- الإضاءات البيضاء اللامعة -->
              <path d="M 60,65 A 45 45 0 0 1 120,55" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
              <path d="M 68,140 A 45 45 0 0 0 100,148" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function openEnvelope() {
      const envelope = document.getElementById('envelope');
      const letter = document.getElementById('letter');

      envelope.classList.add('hide');
      
      setTimeout(() => {
        letter.classList.add('show');
      }, 300);
    }
  </script>
</body>
</html>
